name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax-check the web sources
        # every module; a build step doesn't exist and the UI is not bundled
        run: |
          find web/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run pytest
        run: |
          cd ..
          python -m pytest tests -q
